name: 'Tests: node.js >= 10'

on: [workflow_dispatch]

jobs:
  tests:
    name: 'node ${{ matrix.node-version }}'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 16, 14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: 'pin the npm registry to the 6.10.5 release date'
        run: npm config set registry https://:2022-06-06T00:00:00.000Z@time-machines-npm.sealsecurity.io/
      - run: npm install
      - run: npm run tests-only

  pack:
    name: 'pack qs-6.10.5.tgz'
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # the published tarball was packed with node 18.3.0 / npm 8.11.0; pinning
      # the node patch pins that exact npm, and with it npm pack's member set.
      - uses: actions/setup-node@v4
        with:
          node-version: 18.3.0
      - name: 'pin the npm registry to the 6.10.5 release date'
        run: npm config set registry https://:2022-06-06T00:00:00.000Z@time-machines-npm.sealsecurity.io/
      - run: npm install
      # in 6.10.5 `prepack` is only `npmignore --auto`; it does NOT regenerate
      # dist/qs.js. Upstream's `prepublishOnly` does, which is why the published
      # tarball's bundle differs from the committed one. Run it explicitly, with
      # the registry pinned so browserify resolves to its 2022-06-06 version.
      - run: npm run dist
      # plain `npm pack` on purpose: `prepack` (npmignore --auto) has to run so
      # that publishConfig.ignore is applied to the tarball.
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: qs-6.10.5-tgz
          path: qs-6.10.5.tgz
          if-no-files-found: error

  node:
    name: 'node >= 10'
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: 'echo tests completed'
